[project]
name = "matgraph"
version = "0.1.0"
description = "MatGraphRAG - Phase 1: Materials Project knowledge graph construction with Cognee"
requires-python = ">=3.11,<3.15"
dependencies = [
    "cognee[fastembed]>=1.3.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pymatgen>=2026.5.4",
]

[project.optional-dependencies]
ml = [
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.PydanticDeprecatedSince20", "ignore:Using `httpx`"]
